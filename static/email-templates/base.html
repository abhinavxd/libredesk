{{ define "header" }}
<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <base target="_blank">
    <style>
        body {
            background-color: #f4f4f5;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
            color: #09090b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .wrap {
            background-color: #ffffff;
            padding: 28px;
            border-radius: 8px;
            border: 1px solid #e4e4e7;
        }

        .header {
            padding-bottom: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e4e4e7;
            line-height: 1;
        }

        .content {
            overflow-wrap: anywhere;
            word-wrap: break-word;
        }

        .content > :last-child {
            margin-bottom: 0;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #71717a;
            padding: 16px 0 0;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
        }

        .footer a:hover {
            color: #09090b;
            text-decoration: none;
        }

        .button {
            background-color: #18181b;
            color: #fafafa !important;
            display: inline-block;
            border-radius: 6px;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #09090b;
            margin: 0 0 8px;
            line-height: 1.3;
        }

        p {
            margin: 0 0 14px;
            color: #09090b;
        }

        .text-muted {
            color: #71717a;
            font-size: 14px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        blockquote {
            margin-left: 0;
            margin-right: 0;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 600px) {
            .email-shell {
                padding: 16px 12px !important;
            }

            .wrap {
                padding: 24px 20px !important;
            }

            .button {
                padding: 12px 20px !important;
            }
        }
    </style>
</head>

<body style="margin: 0; background-color: #f4f4f5; font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #09090b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width: 100%; background-color: #f4f4f5;">
        <tr>
            <td class="email-shell" align="center" style="padding: 32px 16px;">
                <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width: 100%; max-width: 560px; table-layout: fixed;">
                    <tr>
                        <td class="wrap" style="padding: 28px; background-color: #ffffff; border: 1px solid #e4e4e7; border-radius: 8px; text-align: left;">
                            <div class="header" style="padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid #e4e4e7; line-height: 1;">
                                {{ if ne LogoURL "" }}
                                    <img src="{{ LogoURL }}" alt="{{ SiteName }}" height="24" style="display: block; height: 24px; width: auto; max-width: 100%; border: 0;">
                                {{ else }}
                                    <img src="{{ RootURL }}/images/logo.png" alt="{{ SiteName }}" height="24" style="display: block; height: 24px; width: auto; max-width: 100%; border: 0;">
                                {{ end }}
                            </div>
                            <div class="content" style="overflow-wrap: anywhere; word-wrap: break-word;">
{{ end }}

{{ define "footer" }}
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="footer" align="center" style="padding-top: 16px; text-align: center; font-size: 12px; line-height: 18px; color: #71717a;">
                            <span>Powered by <a href="https://libredesk.io/" target="_blank" style="color: #71717a; text-decoration: none;">libredesk</a></span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
{{ end }}
