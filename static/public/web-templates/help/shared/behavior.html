{{ define "hc-shared-behavior" }}
    <script>
    (function () {
        var announcement = document.querySelector('[data-hc-announcement]');
        if (announcement) {
            announcement.querySelector('[data-hc-announcement-close]').addEventListener('click', function () {
                try { localStorage.setItem('hc-announcement-' + announcement.dataset.hcAnnouncement, '1'); } catch (e) {}
                announcement.remove();
            });
        }
        var lang = document.querySelector('[data-hc-lang]');
        if (!lang) return;
        if (window.Intl && Intl.DisplayNames) {
            lang.querySelectorAll('[data-hc-locale-name]').forEach(function (el) {
                var code = el.dataset.hcLocaleName;
                try {
                    // Many languages write their own name in lower case, which reads as unfinished in a menu.
                    var name = new Intl.DisplayNames([code], { type: 'language' }).of(code);
                    el.textContent = name.charAt(0).toLocaleUpperCase(code) + name.slice(1);
                } catch (e) {}
            });
        }
        var btn = lang.querySelector('.hc-lang-btn');
        var menu = lang.querySelector('.hc-lang-menu');
        var animation;
        var close = function () {
            if (animation) animation.cancel();
            lang.removeAttribute('data-open');
            btn.setAttribute('aria-expanded', 'false');
        };
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = lang.hasAttribute('data-open');
            if (open) { close(); } else {
                lang.setAttribute('data-open', '');
                btn.setAttribute('aria-expanded', 'true');
                if (e.detail > 0) {
                    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    animation = menu.animate(reduced ? [{ opacity: 0 }, { opacity: 1 }] : [
                        { opacity: 0, transform: 'scale(0.97)' },
                        { opacity: 1, transform: 'scale(1)' }
                    ], { duration: reduced ? 100 : 160, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
                }
            }
        });
        document.addEventListener('click', function (e) { if (!lang.contains(e.target)) close(); });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && lang.hasAttribute('data-open')) {
                if (lang.contains(document.activeElement)) btn.focus();
                close();
            }
        });
        lang.addEventListener('focusout', function (e) { if (!lang.contains(e.relatedTarget)) close(); });
    })();
    </script>
{{ end }}

{{ define "hc-article-behavior" }}
<script>
(function () {
    // The server can only render one fixed English format, so the reader's locale is applied here.
    var lang = document.documentElement.lang || undefined;
    document.querySelectorAll('time.hc-date[datetime]').forEach(function (el) {
        var d = new Date(el.getAttribute('datetime'));
        if (isNaN(d)) return;
        try {
            el.textContent = d.toLocaleDateString(lang, { year: 'numeric', month: 'short', day: 'numeric' });
        } catch (e) {}
    });

    var prose = document.getElementById('hc-prose');
    var toc = document.getElementById('hc-toc');
    if (prose && toc) {
        var headings = prose.querySelectorAll('h2, h3, h4');
        var list = toc.querySelector('ul');
        var links = [];
        var tracked = [];
        headings.forEach(function (h, i) {
            var text = h.textContent.trim();
            if (!text) return;
            if (!h.id) h.id = 'sec-' + i + '-' + text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            var li = document.createElement('li');
            if (h.tagName === 'H3') li.className = 'hc-toc-h3';
            if (h.tagName === 'H4') li.className = 'hc-toc-h4';
            var a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = text;
            li.appendChild(a);
            list.appendChild(li);
            links.push(a);
            tracked.push(h);
        });
        if (links.length >= 2) toc.hidden = false;

        var toggle = document.getElementById('hc-toc-toggle');
        if (toggle) {
            // The rail is permanently open at desktop width, so it stops being a disclosure there.
            var wide = window.matchMedia('(min-width: 1100px)');
            var syncState = function () {
                if (wide.matches) {
                    toggle.setAttribute('aria-expanded', 'true');
                    toggle.disabled = true;
                } else {
                    toggle.disabled = false;
                    toggle.setAttribute('aria-expanded', toc.classList.contains('hc-toc-open') ? 'true' : 'false');
                }
            };
            syncState();
            wide.addEventListener('change', syncState);
            toggle.addEventListener('click', function () {
                toc.classList.toggle('hc-toc-open');
                syncState();
            });
            list.addEventListener('click', function () {
                toc.classList.remove('hc-toc-open');
                syncState();
            });
        }

        if (tracked.length) {
            // A heading counts as reached once it scrolls up to the line where an anchor jump would place it.
            var line = (parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0) + 12;
            var queued = false;
            var markActive = function () {
                queued = false;
                var current = null;
                for (var i = 0; i < tracked.length; i++) {
                    if (tracked[i].getBoundingClientRect().top > line) break;
                    current = links[i];
                }
                // The last sections can be too short to ever reach that line.
                if (window.scrollY > 0 && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) current = links[links.length - 1];
                links.forEach(function (a) { a.classList.toggle('hc-toc-active', a === current); });
            };
            window.addEventListener('scroll', function () {
                if (!queued) { queued = true; requestAnimationFrame(markActive); }
            }, { passive: true });
            markActive();
        }
    }

    if (prose && navigator.clipboard) {
        var copyIcon = '{{ LucideIcon "copy" }}';
        var copiedIcon = '{{ LucideIcon "check" }}';
        var copyLabel = '{{ .L.T "globals.terms.copy" }}';
        var copiedLabel = '{{ .L.T "globals.messages.copied" }}';
        prose.querySelectorAll('pre').forEach(function (pre) {
            var code = pre.querySelector('code');
            if (!code) return;
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'hc-copy';
            btn.innerHTML = copyIcon;
            btn.setAttribute('aria-label', copyLabel);
            btn.title = copyLabel;
            var reset;
            btn.addEventListener('click', function () {
                navigator.clipboard.writeText(code.innerText).then(function () {
                    btn.innerHTML = copiedIcon;
                    btn.setAttribute('data-copied', '');
                    btn.setAttribute('aria-label', copiedLabel);
                    btn.title = copiedLabel;
                    clearTimeout(reset);
                    reset = setTimeout(function () {
                        btn.innerHTML = copyIcon;
                        btn.removeAttribute('data-copied');
                        btn.setAttribute('aria-label', copyLabel);
                        btn.title = copyLabel;
                    }, 1500);
                }).catch(function () {});
            });
            pre.appendChild(btn);
        });
    }

    var box = document.getElementById('hc-helpful');
    if (box) {
        var key = 'hc-feedback:' + box.dataset.endpoint;
        var done = function (pointer) {
            box.querySelector('.hc-helpful-actions').hidden = true;
            box.querySelector('.hc-helpful-q').hidden = true;
            var thanks = box.querySelector('.hc-helpful-thanks');
            thanks.hidden = false;
            if (pointer) {
                var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                thanks.animate([{ opacity: 0 }, { opacity: 1 }], {
                    duration: reduced ? 100 : 160,
                    easing: 'cubic-bezier(0.23, 1, 0.32, 1)'
                });
            }
        };
        try { if (localStorage.getItem(key)) done(); } catch (e) {}
        box.querySelectorAll('button').forEach(function (b) {
            b.addEventListener('click', function (e) {
                var pointer = e.detail > 0;
                var buttons = box.querySelectorAll('button');
                var error = box.querySelector('.hc-helpful-error');
                error.hidden = true;
                buttons.forEach(function (button) { button.disabled = true; });
                fetch(box.dataset.endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ helpful: b.dataset.helpful === 'true' })
                }).then(function (res) {
                    if (!res.ok) throw new Error('Feedback request failed');
                    done(pointer);
                    try { localStorage.setItem(key, b.dataset.helpful); } catch (e) {}
                }).catch(function () {
                    error.hidden = false;
                }).finally(function () {
                    buttons.forEach(function (button) { button.disabled = false; });
                });
            });
        });
    }
})();
</script>
{{ end }}
