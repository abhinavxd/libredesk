{{ define "header" }}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />	
	<title>{{ .Data.Title }} - {{ SiteName }}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />

	<link rel="preload" href="/static/public/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
	<link href="/static/public/static/fonts.css?v={{ AssetVer }}" rel="stylesheet" type="text/css" />
	<link href="/static/public/static/style.css?v={{ AssetVer }}" rel="stylesheet" type="text/css" />

	{{ if ne FaviconURL "" }}
		<link rel="icon" href="{{ FaviconURL }}" type="image/x-icon" />
	{{ end }}
</head>
<body>
    <div class="container wrap">
		<header class="header">
			<div class="logo">
				{{ if ne LogoURL "" }}
					<img src="{{ LogoURL }}" alt="{{ SiteName }}" />
				{{ else }}
					<span class="site-name">{{ SiteName }}</span>
				{{ end }}
			</div>
		</header>
{{ end }}

{{ define "footer" }}
	</div>
	<footer class="container">
		Powered by <a target="_blank" rel="noreferrer" href="https://libredesk.io/">libredesk</a>
	</footer>
</body>
</html>
{{ end }}
