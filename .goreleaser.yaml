env:
  - GO111MODULE=on
  - CGO_ENABLED=0
  - GITHUB_ORG=jakedolan443
  - IMAGE_NAME=fernmail

before:
  hooks:
    - go mod tidy
    - make frontend-build

builds:
  - id: "universal"
    main: ./cmd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - freebsd
      - linux
      - netbsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    binary: fernmail
    ldflags:
      - -s -w -X "main.buildString={{ .Tag }} ({{ .ShortCommit }} {{ .Date }}, {{ .Os }}/{{ .Arch }})" -X "main.versionString={{ .Tag }}"
    hooks:
      post: make stuff BIN={{ .Path }}

archives:
  - format: tar.gz
    name_template: 'fernmail_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Arch "arm" }}v{{ .Arm }}{{ end }}'
    files:
      - config.sample.toml
      - README.md
      - LICENSE

checksum:
  name_template: "fernmail_{{ .Version }}_checksums.txt"

source:
  enabled: true
  format: tar.gz
  name_template: "fernmail_{{ .Version }}_source"

dockers:
  - use: buildx
    goos: linux
    goarch: amd64
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

  - use: buildx
    goos: linux
    goarch: arm64
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-arm64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

  - use: buildx
    goos: linux
    goarch: arm
    goarm: 6
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-armv6"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-armv6"
    build_flag_templates:
      - --platform=linux/arm/v6
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

  - use: buildx
    goos: linux
    goarch: arm
    goarm: 7
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-armv7"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-armv7"
    build_flag_templates:
      - --platform=linux/arm/v7
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-arm64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-armv6"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-armv7"
  - name_template: "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-arm64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-armv6"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-armv7"
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-arm64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-armv6
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:latest-armv7
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-arm64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-armv6
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .Env.IMAGE_NAME }}:{{ .Tag }}-armv7

release:
  github:
    owner: jakedolan443
    name: fernmail
  prerelease: auto
  draft: true
