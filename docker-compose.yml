services:
  # Fernmail app
  app:
    image: ghcr.io/jakedolan443/fernmail:latest
    container_name: libredesk_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # If the password is set during first docker-compose up, the system user password will be set to this value.
      # You can always set the system user password later by running `docker exec -it libredesk_app ./fernmail --set-system-user-password`.
      LIBREDESK_SYSTEM_USER_PASSWORD: ${LIBREDESK_SYSTEM_USER_PASSWORD:-}
    networks:
      - libredesk
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/fernmail/uploads:rw
      - ./config.toml:/fernmail/config.toml
    command: [sh, -c, "./fernmail --install --idempotent-install --yes --config /fernmail/config.toml && ./fernmail --upgrade --yes --config /fernmail/config.toml && ./fernmail --config /fernmail/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: libredesk_db
    restart: unless-stopped
    networks:
      - libredesk
    ports:
      # Only bind on the local interface. To connect to Postgres externally, change this to 0.0.0.0
      - "127.0.0.1:5432:5432"
    environment:
      # Set these environment variables to configure the database, defaults to libredesk.
      POSTGRES_USER: ${POSTGRES_USER:-libredesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libredesk} 
      POSTGRES_DB: ${POSTGRES_DB:-libredesk}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libredesk} -d ${POSTGRES_DB:-libredesk}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: libredesk_redis
    restart: unless-stopped
    ports:
      # Only bind on the local interface.
      - "127.0.0.1:6379:6379"
    networks:
      - libredesk
    volumes:
      - redis-data:/data

networks:
  libredesk:

volumes:
  postgres-data:
  redis-data:
