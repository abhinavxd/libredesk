name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      db:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: libredesk
          POSTGRES_PASSWORD: libredesk
          POSTGRES_DB: libredesk
        options: >-
          --health-cmd="pg_isready -U libredesk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.25.0"

      - name: Install pnpm
        run: npm install -g pnpm@9.15.3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache the cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install cypress deps
        run: sudo apt-get update && sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Build binary and frontend
        run: make build

      - name: Configure app
        run: |
          cp config.sample.toml config.toml
          sed -i 's/host = "db"/host = "127.0.0.1"/' config.toml
          sed -i 's/address = "redis:6379"/address = "localhost:6379"/' config.toml
          # upload.fs.upload_path is not created by the app, so attachment uploads 500 without it
          mkdir -p uploads

      - name: Run unit tests for frontend
        run: cd frontend && pnpm test:run

      - name: Install db schema and run tests
        env:
          LIBREDESK_SYSTEM_USER_PASSWORD: "StrongPass!123"
          # E2E runs over plain HTTP, so the Secure session/csrf cookies must be off
          # or real login + writes would be rejected.
          LIBREDESK_APP__SERVER__DISABLE_SECURE_COOKIES: "true"
          # The livechat widget suite makes far more than 100 widget requests a minute.
          LIBREDESK_RATE_LIMIT__WIDGET__REQUESTS_PER_MINUTE: "100000"
          LIBREDESK_RATE_LIMIT__PUBLIC__REQUESTS_PER_MINUTE: "100000"
          CYPRESS_SYSTEM_PASSWORD: "StrongPass!123"
          CYPRESS_MAILHOG_URL: "http://localhost:8025"
        run: |
          ./libredesk --install --idempotent-install --yes --config ./config.toml
          ./libredesk --upgrade --yes --config ./config.toml
          ./libredesk --config ./config.toml &
          for i in $(seq 1 60); do
            if [ "$(curl --connect-timeout 1 --max-time 2 -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)" = "200" ]; then
              echo "app is up"; break
            fi
            if [ "$i" = "60" ]; then echo "app did not start"; exit 1; fi
            sleep 1
          done
          cd frontend
          specs=$(find cypress/e2e -type f -regextype posix-extended -regex '.*\.(cy|spec)\.(js|jsx|ts|tsx)$' | sort | awk -v s=${{ matrix.shard }} -v n=5 'NR % n == s % n' | paste -sd,)
          echo "shard ${{ matrix.shard }} runs: $specs"
          pnpm exec cypress run --e2e --headless --spec "$specs"