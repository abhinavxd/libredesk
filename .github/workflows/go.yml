name: Go

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mirror.gcr.io/library/postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: libredesk
          POSTGRES_PASSWORD: libredesk
          POSTGRES_DB: libredesk
        options: >-
          --health-cmd="pg_isready -U libredesk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      LIBREDESK_TEST_DB_DSN: "postgres://libredesk:libredesk@127.0.0.1:5432/libredesk?sslmode=disable&connect_timeout=3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Install dependencies
        run: go get -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install GNU Gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Run tests
        run: make test
