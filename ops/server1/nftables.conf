#!/usr/sbin/nft -f

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority -100; policy drop;

    iifname "lo" accept
    ct state invalid drop
    ct state established,related accept

    # Permit diagnostics and path-MTU discovery; no TCP/UDP listener is public.
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
  }

  chain forward {
    type filter hook forward priority -100; policy drop;

    ct state invalid drop
    ct state established,related accept

    # Docker user networks are allocated from this pool. New connections may
    # leave containers, but unsolicited connections to them are not accepted.
    ip saddr 172.30.0.0/16 accept
  }

  chain output {
    type filter hook output priority -100; policy accept;
  }
}
