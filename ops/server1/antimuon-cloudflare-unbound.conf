# Route this zone to Cloudflare's encrypted resolver.
# This avoids a stale upstream negative cache immediately after a Cloudflare
# Tunnel hostname is created, without changing the NanoPi's default Quad9 DNS.
forward-zone:
  name: "antimuonstudios.com."
  forward-tls-upstream: yes
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 1.0.0.1@853#cloudflare-dns.com
